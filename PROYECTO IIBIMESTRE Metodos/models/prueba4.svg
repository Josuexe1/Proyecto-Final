<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <!-- Contorno exterior (figura irregular) -->
  <polygon points="50,20 150,20 180,80 150,140 50,140 20,80" fill="none" stroke="blue" stroke-width="2"/>
  <!-- Hueco 1 (círculo) -->
  <circle cx="100" cy="50" r="15" fill="none" stroke="blue" stroke-width="2"/>
  <!-- Hueco 2 (triángulo) -->
  <polygon points="100,100 80,130 120,130" fill="none" stroke="blue" stroke-width="2"/>
</svg>